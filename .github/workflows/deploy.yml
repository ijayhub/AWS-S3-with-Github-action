
name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ arn:aws:iam::266735847504:role/GitHubActions-S3-Deployment-Role }}
          aws-region: ${{ us-east-1 }}

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://${{ hello-266735847504-us-east-1-an }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"
