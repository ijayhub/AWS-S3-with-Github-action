
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Cloud In Real Life</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        h1 {
            font-size: 120px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background: #0284c7;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        a:hover {
            background: #0369a1;
        }

        footer {
            margin-top: 60px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 90px;
            }

            h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">

        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
            The page you are looking for might have been moved,
            deleted, or does not exist.
            Don't worry, let's get you back on track.
        </p>

        <a href="index.html">Back to Home</a>

        <footer>
            &copy; 2026 Cloud In Real Life. Hosted on Amazon S3.
        </footer>

    </div>

</body>
</html>
